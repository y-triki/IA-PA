<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Résultat</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white font-sans p-8">
<nav class="flex items-center justify-between p-4 border-b border-gray-700">
      <div class="flex items-center">

        <h1 class="text-xl font-bold">Smart Assistant</h1>
      </div>
      <div class="space-x-2">
        <button class="language-btn px-3 py-1 rounded bg-blue-600 text-white" data-lang="fr">
        <a href="{{ url_for('index') }}" class="text-blue-400 hover:underline">⬅</a></button>
      </div>
    </nav>
  <div class="max-w-4xl mx-auto space-y-12">

    <!-- Aperçu PDF -->
    {% if filename %}
    <section>
      <h2 class="text-2xl font-bold mb-4">Aperçu du document PDF</h2>
      <iframe src="{{ url_for('uploaded_file', filename=filename) }}"
              width="100%" height="600px" class="border border-gray-700 rounded"></iframe>
    </section>
    {% endif %}

    <!-- Résumé généré -->
    <section>
      <h2 class="text-2xl font-bold mb-4">Résumé</h2>
      <div class="bg-gray-800 p-4 rounded shadow whitespace-pre-line">{{ summary }}</div>
    </section>

   <!-- Chat Q&A -->
<section class="mt-10 p-6 bg-gray-900 rounded-2xl shadow-md">
  <h2 class="text-2xl font-bold text-white mb-4">Posez une question</h2>

  <form method="POST" action="{{ url_for('ask_question') }}" class="flex flex-col sm:flex-row gap-4">
    <input type="hidden" name="filename" value="{{ filename }}" />

    <input
      type="text"
      name="question"
      placeholder="Ex : Que dit le document sur le chapitre X ?"
      required
      class="flex-grow px-4 py-2 rounded-xl border border-blue-500 bg-gray-800 text-white
             placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
    />

    <button
      type="submit"
      class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-6 py-2 rounded-xl transition"
    >
      Envoyer
    </button>
  </form>

  {% if answer %}
  <div class="mt-6 bg-gray-800 border border-gray-600 p-4 rounded-xl text-white">
    <strong class="block mb-2 text-gray-300">Réponse :</strong>
    <p>{{ answer }}</p>
  </div>
  {% endif %}
</section>

    <!-- Bouton de génération de QCM -->
    <section>
      <h2 class="text-2xl font-bold mb-4">Générer un QCM</h2>
      <form method="POST" action="{{ url_for('generate_quiz_route') }}">
        <input type="hidden" name="filename" value="{{ filename }}" />
        <button type="submit" class="bg-green-600 px-6 py-2 rounded hover:bg-green-700">
          Générer un QCM
        </button>
      </form>
    </section>

    <!-- Retour -->
    <section class="text-center mt-10">
      <a href="{{ url_for('index') }}" class="text-blue-400 hover:underline">⬅ Retour à l'accueil</a>
    </section>

  </div>
</body>
</html>
